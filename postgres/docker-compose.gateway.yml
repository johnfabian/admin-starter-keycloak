name: admin-starter-postgres-gateway

services:
  postgres:
    image: postgres:16-alpine
    container_name: app-traefik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_traefik_data:/var/lib/postgresql/data
      - ./init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      Postgres:
        aliases:
          - postgres

networks:
  Postgres:
    name: admin-starter-postgres-gateway
    internal: true

volumes:
  postgres_traefik_data:
    name: admin-starter-postgres-traefik-data
